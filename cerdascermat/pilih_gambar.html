<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tebak Isi Kotak - Dirgahayu RI ke-81</title>

<style>
:root{
    --merah:#C8102E;
    --putih:#ffffff;
    --emas:#FFD24C;
    --emas-tua:#B8860B;
    --navy-gelap:#1a0a0a;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Arial, sans-serif;
}

body{
    background:
        radial-gradient(circle at 20% 20%, rgba(255,210,76,0.12), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(200,16,46,0.25), transparent 45%),
        linear-gradient(160deg,#3a0a0a 0%, #1a0a0a 55%, #0d0505 100%);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    padding:30px 20px;
    overflow-x:hidden;
    position:relative;
}

/* Pola batik/garis halus dekoratif di background */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
        repeating-linear-gradient(45deg, rgba(255,210,76,0.035) 0px, rgba(255,210,76,0.035) 2px, transparent 2px, transparent 40px);
    pointer-events:none;
}

.eyebrow{
    letter-spacing:4px;
    font-size:13px;
    color:var(--emas);
    text-transform:uppercase;
    margin-bottom:10px;
    font-weight:600;
}

h1{
    margin-bottom:6px;
    text-align:center;
    font-size:clamp(28px,5vw,46px);
    font-weight:800;
    background:linear-gradient(180deg,#fff,var(--emas));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 4px 18px rgba(0,0,0,0.35);
}

.subjudul{
    text-align:center;
    color:#ffd9d9;
    font-size:16px;
    margin-bottom:8px;
}

.angka81{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin:4px 0 20px 0;
}

.angka81 .num{
    font-size:clamp(50px,9vw,90px);
    font-weight:900;
    color:var(--merah);
    -webkit-text-stroke:2px var(--emas);
    line-height:1;
}

.angka81 .label{
    font-size:18px;
    font-weight:700;
    color:var(--emas);
}

.container{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:28px;
    flex-wrap:wrap;
    max-width:1100px;
    perspective:1200px;
}

.kotak{
    width:220px;
    height:220px;
    cursor:pointer;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 0.9s cubic-bezier(.4,.2,.2,1);
}

.kotak.terbuka{
    transform:rotateY(180deg);
}

.sisi{
    position:absolute;
    inset:0;
    border-radius:16px;
    backface-visibility:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.45);
}

.depan{
    background:linear-gradient(145deg,var(--merah),#8c0a1f);
    border:3px solid var(--emas);
}

.depan::before{
    content:"🎁";
    font-size:75px;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,0.4));
}

.depan .nomor{
    position:absolute;
    top:10px;
    left:14px;
    font-size:13px;
    color:var(--emas);
    font-weight:700;
    letter-spacing:1px;
}

.belakang{
    transform:rotateY(180deg);
    background:#222;
    border:3px solid var(--emas);
}

.belakang img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* Ikon kecil "perbesar" muncul di kotak yang sudah terbuka, sbg petunjuk klik utk lihat penuh */
.belakang .zoom-hint{
    position:absolute;
    bottom:8px;
    right:10px;
    background:rgba(0,0,0,0.55);
    color:var(--emas);
    font-size:13px;
    padding:4px 8px;
    border-radius:8px;
    pointer-events:none;
}

.kotak:hover{
    filter:brightness(1.08);
}

#pertanyaan{
    margin-top:18px;
    width:100%;
    max-width:91200px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,210,76,0.35);
    backdrop-filter:blur(4px);
    padding:24px 28px;
    border-radius:14px;
    font-size:clamp(18px,2.4vw,26px);
    font-weight:700;
    text-align:center;
    line-height:1.5;
}

#tombol-jawaban{
    margin-top:18px;
    padding:14px 38px;
    font-size:17px;
    font-weight:700;
    letter-spacing:0.5px;
    color:#3a0a0a;
    background:linear-gradient(180deg,var(--emas),var(--emas-tua));
    border:none;
    border-radius:50px;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(0,0,0,0.4);
    transition:transform 0.2s, box-shadow 0.2s;
}

#tombol-jawaban:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 22px rgba(0,0,0,0.5);
}

#tombol-jawaban:active{
    transform:translateY(0px);
}

#tombol-jawaban:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

#jawaban{
    margin-top:18px;
    font-size:clamp(20px,3vw,30px);
    font-weight:800;
    color:var(--emas);
    text-align:center;
    min-height:40px;
    display:none;
    text-shadow:0 2px 8px rgba(0,0,0,0.5);
}

footer{
    margin-top:40px;
    font-size:13px;
    color:rgba(255,255,255,0.55);
    text-align:center;
}

/* ===== Lightbox / tampilan gambar penuh ===== */
#lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    backdrop-filter:blur(3px);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:30px;
    cursor:zoom-out;
    animation:fadeIn 0.25s ease;
}

#lightbox.tampil{
    display:flex;
}

@keyframes fadeIn{
    from{ opacity:0; }
    to{ opacity:1; }
}

#lightbox img{
    max-width:min(90vw,600px);
    max-height:85vh;
    border-radius:18px;
    border:4px solid var(--emas);
    box-shadow:0 20px 50px rgba(0,0,0,0.6);
    cursor:default;
    animation:popIn 0.25s ease;
}

@keyframes popIn{
    from{ transform:scale(0.85); opacity:0; }
    to{ transform:scale(1); opacity:1; }
}

#lightbox-tutup{
    position:absolute;
    top:22px;
    right:28px;
    width:42px;
    height:42px;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,210,76,0.5);
    color:var(--emas);
    font-size:22px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1;
}

#lightbox-tutup:hover{
    background:rgba(255,255,255,0.22);
}

@media(max-width:600px){
    .kotak{
        width:150px;
        height:150px;
    }
    .depan::before{
        font-size:55px;
    }
    .container{
        gap:16px;
    }
}
</style>
</head>
<body>

<div class="eyebrow">17 Agustus 2026</div>
<h1>Tebak Isi Kotak</h1>
<div class="angka81">
    <span class="num">81</span>
    <span class="label">TAHUN<br>INDONESIA MERDEKA</span>
    
</div>

<div class="container">

    <div class="kotak" data-index="0">
        <div class="sisi depan"><span class="nomor">01</span></div>
        <div class="sisi belakang">
            <img src="diponegoro.png" alt="Pahlawan 1">
        </div>
    </div>

    <div class="kotak" data-index="1">
        <div class="sisi depan"><span class="nomor">02</span></div>
        <div class="sisi belakang">
            <img src="Cut Nyak Dien.png" alt="Pahlawan 2">
        </div>
    </div>

    <div class="kotak" data-index="2">
        <div class="sisi depan"><span class="nomor">03</span></div>
        <div class="sisi belakang">
            <img src="Sultan Hasanudin.png" alt="Pahlawan 3">
        </div>
    </div>

    <div class="kotak" data-index="3">
        <div class="sisi depan"><span class="nomor">04</span></div>
        <div class="sisi belakang">
            <img src="kapiten Patimura.png" alt="Pahlawan 4">
        </div>
    </div>

</div>

<div id="pertanyaan">
    Siapakah nama pahlawan seperti yang ditunjukkan pada foto tersebut?
</div>

<button id="tombol-jawaban" disabled>Lihat Jawaban</button>

<div id="jawaban"></div>

<footer>Klik salah satu kotak untuk membukanya. Klik lagi gambarnya untuk melihat versi penuh, lalu tekan tombol jawaban.</footer>

<!-- Lightbox untuk menampilkan gambar penuh di tengah layar -->
<div id="lightbox">
    <div id="lightbox-tutup">&times;</div>
    <img id="lightbox-img" src="" alt="Gambar penuh">
</div>

<script>

const namaPahlawan = [
    "Diponegoro",
    "Cut Nyak Dien",
    "Sultan Hasanuddin",
    "Kapiten Patimura"
];

const daftarKotak = document.querySelectorAll(".kotak");
let kotakAktif = null;

daftarKotak.forEach(kotak=>{
    const index = parseInt(kotak.dataset.index);

    kotak.addEventListener("click", (e)=>{
        if(kotak.classList.contains("terbuka")){
            // Kotak sudah terbuka -> klik gambar menampilkan versi penuh di tengah
            bukaLightbox(index);
        } else {
            // Kotak masih tertutup -> buka kotaknya (animasi flip)
            bukaKotak(kotak, index);
        }
    });
});

function bukaKotak(kotakDipilih, index){

    // Tutup semua kotak
    daftarKotak.forEach(kotak=>{
        kotak.classList.remove("terbuka");
    });

    // Buka kotak yang dipilih dengan animasi rotasi horizontal
    kotakDipilih.classList.add("terbuka");
    kotakAktif = index;

    // Reset & aktifkan tombol jawaban
    document.getElementById("jawaban").style.display = "none";
    document.getElementById("tombol-jawaban").disabled = false;
}

function tampilkanJawaban(){
    if(kotakAktif === null) return;
    const elJawaban = document.getElementById("jawaban");
    elJawaban.textContent = "🏅 " + namaPahlawan[kotakAktif];
    elJawaban.style.display = "block";
}
document.getElementById("tombol-jawaban").addEventListener("click", tampilkanJawaban);

// ===== Logika Lightbox =====
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const lightboxTutup = document.getElementById("lightbox-tutup");

function bukaLightbox(index){
    const kotak = document.querySelector(`.kotak[data-index="${index}"]`);
    const srcGambar = kotak.querySelector(".belakang img").src;
    lightboxImg.src = srcGambar;
    lightboxImg.alt = namaPahlawan[index];
    lightbox.classList.add("tampil");
}

function tutupLightbox(){
    lightbox.classList.remove("tampil");
}

lightboxTutup.addEventListener("click", (e)=>{
    e.stopPropagation();
    tutupLightbox();
});

// Klik area gelap di luar gambar juga menutup lightbox
lightbox.addEventListener("click", (e)=>{
    if(e.target === lightbox){
        tutupLightbox();
    }
});

// Tombol Escape menutup lightbox
document.addEventListener("keydown", (e)=>{
    if(e.key === "Escape"){
        tutupLightbox();
    }
});

</script>

</body>
</html>
